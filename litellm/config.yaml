# LiteLLM spine. Lane C metered routing.
# This file is the limb: it enforces routing policy, it does not decide it.
# Loopback only (bind via `--host 127.0.0.1`). store_model_in_db stays off so this file
# is authoritative (no DB overlay). No Postgres/Redis for personal use.
#
# MINIMAL-GATE ENFORCEMENT (P3b): every OpenRouter deployment below carries
#   provider.data_collection: deny   -> OpenRouter routes only to providers that do NOT
#                                       train on / store prompts (blocks train-on-data).
#                                       THIS is the hard filter; it holds regardless of
#                                       allow_fallbacks.
#   provider.allow_fallbacks: true   -> if the primary no-train host is unavailable, fall
#                                       through to ANOTHER no-train host instead of erroring.
#                                       (was false; deny already blocks training
#                                       providers, so a fallback can only land on another
#                                       no-train host. true buys resilience with no loss of
#                                       the no-train guarantee. Does NOT change which host is
#                                       picked by default -- still cheapest no-train.)
# This is the gate: it sits on the deployment, so a spoke cannot bypass it by omitting a
# tag. Caveat: OpenRouter's data tags are best-effort, not authoritative (their words), so
# this is defense-in-depth, not a guarantee. Latency note: OpenRouter defaults to the
# CHEAPEST no-train host (slow), so the alias deployments below steer to a FAST no-train
# host via provider.order (SHIPPED: order: [Fireworks, Baseten, Together,
# DeepInfra] on glm-5.2 and kimi-k3; order is a preference, deny stays the hard filter).
# The openrouter/* passthrough carries no order and still takes the cheapest no-train
# host. Stricter per-tier pinning (zdr:true, direct-only) is a future tightening,
# backlog.

model_list:
  # Passthrough to OpenRouter for any model id (a client's full reach), gated no-train.
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: true

  # Short-name aliases so a client's runtime `/model` switch works without the openrouter/
  # prefix (DA-3). Roster (tier/trust/task-fit) is decided outside this file.
  - model_name: glm-5.2
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: true
          # No-train host steering. deny above is the HARD filter (holds
          # regardless of order); order is only a PREFERENCE for a faster no-train
          # host over OpenRouter's cheapest-default. Every pinned host here is
          # no-train-compliant, so deny still holds even on the first-choice host.
          order: [Fireworks, Baseten, Together, DeepInfra]

  - model_name: kimi-k3
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: true
          # No-train host steering. deny above is the HARD filter (holds
          # regardless of order); order is only a PREFERENCE for a faster no-train
          # host over OpenRouter's cheapest-default. Every pinned host here is
          # no-train-compliant, so deny still holds even on the first-choice host.
          order: [Fireworks, Baseten, Together, DeepInfra]

  # Direct-to-Anthropic path: the non-proxied destination a future stricter per-tier gate
  # would use. CONFIGURED, not live until an Anthropic API key is provisioned (DA-6 lean:
  # deferred; new spend). Not gated by data_collection (direct provider, no proxy hop).
  # ANTHROPIC_API_KEY is optional: run.sh exports an empty default so this
  # deployment never blocks startup, and the route only works once you set a
  # real key (issue #186).
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  # Scaffolding for a future stricter per-tier gate (tag -> allowed-model rules). The
  # CURRENT minimal-gate enforcement is data_collection:deny on the deployments above,
  # not tags (tags are not a security boundary unless the tagging path is trusted).
  enable_tag_filtering: true

litellm_settings:
  drop_params: true
  # Lane C spend capture. success_callback appends one JSONL row per
  # completed request (model + tokens + authoritative OpenRouter cost) to
  # $LANE_C_SPEND_LOG, defaulting to <$CHRONICLE_DATA_DIR or ~/.chronicle>/
  # litellm/spend.jsonl -- the same root server/db.ts uses, so a fresh clone
  # needs no configuration for Chronicle's Spend tab to read what this writes
  # (issue #186). The spine leaves no session files, so this IS Lane C's raw
  # capture. Module resolved via PYTHONPATH (run.sh). Metrics only: no message
  # content ever lands in a row.
  callbacks: ["lane_c_spend_logger.instance"]

general_settings:
  # Deterministic auth via a master key (env ref, never inlined). Chosen over keyless:
  # keyless + no DB made LiteLLM 500 on a client's endpoint-probe requests and spam a
  # per-request "No connected db" ERROR. The value comes from the environment:
  # export it yourself, or put it in the gitignored env file run.sh sources
  # ($LITELLM_ENV_FILE, default litellm/.env; see litellm/.env.example).
  # No raw secret in any yaml, ever.
  master_key: os.environ/LITELLM_MASTER_KEY

# Auth = master key (above) + loopback bind. CLOUD CAVEAT (revisit trigger): the master
# key alone is not enough off-laptop; before any cloud / multi-tenant / network-exposed
# deploy, add network controls (and rotate LITELLM_MASTER_KEY).
