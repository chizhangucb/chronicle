# Gate `main` on typecheck, tests, and build success.
#
# This workflow runs the TypeScript type gate (tsc -b), the full test suite
# (66 tests via node --test), and the Vite production build on every push to
# `main` and every pull request targeting `main`. It enforces that:
# - All TypeScript compiles without errors (the type gate)
# - All 66 tests pass (test suite)
# - The Vite client bundle builds without errors
#
# Node 24 is REQUIRED — the server + tests run .ts natively via Node's
# type-stripping, which requires Node 24+.
#
# Lint (eslint/prettier) is a later phase; do not add it here.
name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
