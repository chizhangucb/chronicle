# Gate `main` on typecheck, tests, build, and E2E success.
#
# This workflow runs the TypeScript type gate (tsc -b), the full unit test
# suite (via node --test), the Vite production build, and the Playwright E2E
# smoke suite (a seeded big fixture — 120 subagents, 5000 messages — driven
# through a real Chromium) on every push to `main` and every pull request
# targeting `main`. It enforces that:
# - All TypeScript compiles without errors (the type gate)
# - All unit tests pass (test suite)
# - The Vite client bundle builds without errors
# - The E2E smoke suite passes (function, overflow, data-scale, perf floor)
#
# Node 24 is REQUIRED — the server + tests run .ts natively via Node's
# type-stripping, which requires Node 24+.
#
# Lint (eslint/prettier) is a later phase; do not add it here.
name: CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Server-side confidentiality gate for this public satellite (CHI-353): blocks
  # a merge that leaks an owner home path, a committed secret shape, or a
  # machine-specific identifier (CHI-416). Stdlib python3, no deps. The richer
  # hub-vocabulary scan is client-side in the hub egress gate, and so is the
  # hub-value comparison, which needs a hub CI does not have and skips here.
  # Keep the job id `confidentiality` stable: branch protection requires it by
  # that name.
  confidentiality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The guard's own tests run FIRST: a guard whose logic has quietly
      # regressed passes every scan while catching nothing.
      - name: Confidentiality guard tests
        run: python3 scripts/tests/test_confidentiality_guard.py
      - name: Confidentiality guard
        run: python3 scripts/confidentiality_guard.py

  # Pre-PR staleness guard (CHI-362): fail a PR whose branch is behind
  # origin/main, so a stale branch is caught before it surfaces as a surprise
  # DIRTY conflict at merge time (the CHI-324 PR #135 miss). Backs
  # build-discipline.md "Landing to main" (rebase onto current main + dry-run the
  # merge); this is the unskippable version of that step. PR-only: a push to
  # main can't be behind itself. Checks out the PR HEAD (not the merge ref) with
  # full history so the guard can compare against and dry-run-merge origin/main.
  staleness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Staleness guard (behind-main + conflict map)
        run: node scripts/landing_preflight.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium (+ OS deps)
        run: npx playwright install chromium --with-deps

      - name: Build client
        run: npm run build

      - name: Run E2E smoke suite
        run: npm run test:e2e
