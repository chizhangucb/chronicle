# The software factory's thin caller. This is the only factory file chronicle carries;
# everything it runs lives in chizhangucb/software-factory. It is a copy of that repo's
# templates/factory.yml, so keep it a copy: the only things chronicle changes are the inputs
# each job passes, plus the two closed-ticket clauses marked "chronicle" below.
#
# factory_ref must equal the ref in each `uses:` (the scripts are checked out at factory_ref;
# GitHub does not tell a cross-repo reusable workflow which ref it came from). Change both together.
#
# node_version is 24 everywhere the target's own tooling runs: chronicle's server and tests read
# .ts through Node's type stripping, and package.json says engines.node >= 24.
#
# test/factory-caller-wakeups.test.mjs pins the wake-up rules and the pause below by evaluating
# them; test/factory-caller-inputs.test.mjs pins the inputs each job passes.
name: factory

on:
  issues:
    # unlabeled and unassigned: a ticket held back by hold or by an
    # assignee reaches the factory the moment the human removes the blocker,
    # instead of waiting for the next heartbeat. Which of
    # those removals the dispatcher actually answers is its own condition's
    # job, below: the factory's own removals are dropped there, and so is any
    # removal on a closed ticket.
    types: [closed, labeled, unassigned, unlabeled]
  pull_request_target:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed: the first-20 audit on merged factory PRs
  push:
    branches: [main] # update-branch: bring stale auto-merge PRs up to date when main moves
  repository_dispatch:
    # factory-update-branch: sent by the review workflow on a passing verdict.
    # factory-sweep: the heartbeat, and what actually drives the sweep. Required, not optional.
    # Send it from outside GitHub on the interval factory/heartbeat/interval.ts names in the factory
    # repo, which with that repo's README is the only place it is written down, with a token that
    # has contents write on the target and nothing else. One sender covers any number of targets:
    #   gh api repos/chizhangucb/chronicle/dispatches -f event_type=factory-sweep
    types: [factory-update-branch, factory-sweep]
  schedule:
    # The fallback, not the heartbeat: measured on one private target over 21 and a half hours this
    # fired 6 times against about 129 expected, so run the heartbeat above and treat it as belt and
    # braces. Off the :00 slots, since GitHub delays crons on busy minutes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write # factory/verdict, factory/red-green, factory/test-integrity
  checks: read # retry handler: the head's check runs
  actions: read # retry handler: failing runs' logs and artifacts

jobs:
  # The pause. Set the repository variable FACTORY_PAUSED on this repo and the factory stops;
  # delete it and the factory carries on:
  #   gh variable set FACTORY_PAUSED --repo chizhangucb/chronicle --body "runaway sweep, see #123"
  #   gh variable delete FACTORY_PAUSED --repo chizhangucb/chronicle
  # The value is the reason, not a flag, so the repo says why it is paused rather than leaving
  # a reader to infer it from an absence of runs. Any non-empty value pauses, so a maintainer
  # who types "false" into it pauses the factory instead of arming a trap. An empty value reads
  # as unset, GitHub's own rule for a variable that is not there, so delete rather than blank it.
  #
  # Why a variable: `vars` is readable in a job's `if:` and `secrets` is not, and a variable
  # shows up in Settings, Secrets and variables, Actions, where someone looking at the repo
  # finds it without reading this file. FACTORY_PAT cannot write repo variables, so the factory
  # can never pause or resume itself.
  #
  # What it gates, job by job below: dispatch, implement, review, implement-pr and
  # update-branch, everything that starts work or moves it along. What it deliberately does
  # not gate: merge-gate and audit, the two that judge a pull request somebody else already
  # opened. A pause that took those down would silently drop factory/red-green and
  # factory/test-integrity from every PR opened while it was on. That is exactly what
  # `gh workflow disable factory.yml` does, and why disabling this file is the wrong breaker.
  # audit is not idle while paused, to be clear: it runs a model on each merged factory PR
  # inside its first-20 window and on a miss it opens a revert PR and a needs-human issue.
  # That is wanted. A bad merge that landed just before the pause is what you most want
  # caught while everything else is stopped.
  #
  # Nothing is queued while paused: a gated job's `if:` evaluates to false and the job is
  # skipped before a runner is assigned, so a resume starts nothing retroactively. The factory
  # picks up from the repo's state on the next heartbeat, the same state any sweep reads, so
  # fix what caused the pause before lifting it. A pause does not cancel a run already in
  # flight, and it is what makes `gh run cancel` stick: the retry handler's re-label lands on
  # a gated implement job and starts nothing. Pause first, cancel second.
  # The factory's docs/pipeline.md has the rest, including what a pause does not do.
  paused:
    if: vars.FACTORY_PAUSED != ''
    runs-on: ubuntu-latest
    permissions: {} # it reads and writes nothing: the whole job is one echo
    steps:
      # The reason goes through the environment rather than into the script text, so whatever
      # is typed into the variable is data and never a command. The annotation shows its first
      # line only, which is GitHub's limit on one; the summary below shows all of it.
      - name: Say the factory is paused, and why
        env:
          REASON: ${{ vars.FACTORY_PAUSED }}
        run: |
          echo "::warning title=factory paused::$REASON"
          {
            echo "## The factory is paused on this repo"
            echo ""
            echo "Reason: $REASON"
            echo ""
            echo 'Still running: `merge-gate` and `audit`. Nothing else is.'
            echo 'Resume: `gh variable delete FACTORY_PAUSED --repo '"$GITHUB_REPOSITORY"'`'
          } >> "$GITHUB_STEP_SUMMARY"

  # An unlabeled event wakes the sweep for any label except the factory's own two
  # namespaces, agent:* and factory:*. Every label the factory writes goes in with
  # FACTORY_PAT so it fires its event, which is what lets adding agent:implement start
  # an implementer, and that cuts both ways: without the two clauses below a removal
  # the factory made woke a full sweep too. A run's cleanup takes its agent:* label
  # off, the sweep that removal woke found the ticket takeable again and re-stamped it,
  # and a cancelled run had a replacement within seconds (#170).
  # Both removals are admitted on an open ticket only: a closed ticket can never be
  # dispatched, so the sweep would bill a minute for nothing (#213). A close still wakes it,
  # because closing one ticket can unblock another, and it arrives already closed.
  # What still reaches the sweep, on purpose: a human dropping hold or
  # needs-human, a human dropping an assignee, and the factory's own
  # escalation dropping ready-for-agent.
  dispatch:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-sweep') ||
      (github.event_name == 'issues' && (github.event.action == 'closed' ||
        (github.event.action == 'unassigned' && github.event.issue.state != 'closed') ||
        (github.event.action == 'unlabeled' && github.event.issue.state != 'closed' &&
          !startsWith(github.event.label.name, 'agent:') &&
          !startsWith(github.event.label.name, 'factory:')) ||
        (github.event.action == 'labeled' && github.event.issue.state != 'closed' &&
          github.event.label.name == 'ready-for-agent'))))
    uses: chizhangucb/software-factory/.github/workflows/dispatch.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # chronicle is public: anyone can open an issue, and a ticket body is what the
      # implementer executes. Only the owner's own tickets run (software-factory's
      # ADR 0002, 2026-09-07 amendment).
      trusted_author_associations: OWNER
  implement:
    # chronicle: the `github.event.issue.state != 'closed'` clause here, and the one on the
    # dispatch job's `labeled` branch above, are the one place this caller reads #213's
    # closed-ticket rule more broadly than templates/factory.yml does. The template gates the
    # two removals on state and leaves both `labeled` paths ungated; chronicle gates every
    # label edit, because labelling a closed ticket is bookkeeping on finished work and the
    # dispatcher would refuse it anyway (#365). It only ever refuses a run the factory would
    # have refused, so a straight re-copy of the template reverts it safely: if it goes, it is
    # test/factory-caller-wakeups.test.mjs that goes red, and that red is a decision to take,
    # not drift to repair.
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'issues' &&
      github.event.action == 'labeled' && github.event.issue.state != 'closed' &&
      github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  review:
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'pull_request_target' &&
      github.event.label.name == 'agent:review'
    uses: chizhangucb/software-factory/.github/workflows/agent-review.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  implement-pr:
    if: >-
      vars.FACTORY_PAUSED == '' && github.event_name == 'pull_request_target' &&
      github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement-pr.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  merge-gate:
    # Ungated on purpose, with audit below: this is the required check on a pull request, so a
    # paused factory still judges what is open rather than stranding it behind a check that
    # never reports.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: chizhangucb/software-factory/.github/workflows/merge-gate.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
      # We have two kinds of test, and the gate runs each changed test file with
      # one command. Handed the default `node --test`, a browser spec dies on
      # import before a single test reports (#320, #335), so the command routes:
      # scripts/ci/factory-test-command.sh sends a spec to the browser suite and
      # everything else to `node --test`.
      test_command: ./scripts/ci/factory-test-command.sh
      # This REPLACES the gate's default `npm ci` rather than running after it,
      # so `npm ci &&` is load-bearing: without it both checkouts have no
      # node_modules. Run once per checkout, which is why the browser install
      # belongs here and not in test_command, which runs once per file.
      install_command: npm ci && npx playwright install --with-deps chromium
  audit:
    # Ungated on purpose: a bad merge that landed just before the pause is the thing you most
    # want caught while everything else is stopped, and its revert PR is the alarm, not new
    # work. Bounded to one run per merged PR inside the first-20 window, and it never starts a
    # ticket or puts an agent on a branch.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    uses: chizhangucb/software-factory/.github/workflows/agent-audit.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  update-branch:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'factory-update-branch'))
    uses: chizhangucb/software-factory/.github/workflows/update-branch.yml@main
    secrets: inherit
    with:
      factory_ref: main
