# The software factory's thin caller. This is the only factory file chronicle carries;
# everything it runs lives in chizhangucb/software-factory.
#
# factory_ref must equal the ref in each `uses:` (the scripts are checked out at factory_ref;
# GitHub does not tell a cross-repo reusable workflow which ref it came from). Change both together.
#
# node_version is 24 everywhere the target's own tooling runs: chronicle's server and tests read
# .ts through Node's type stripping, and package.json says engines.node >= 24.
#
# Pausing this target: set the repository variable FACTORY_PAUSED to any non-empty value
# (Settings -> Secrets and variables -> Actions -> Variables). While it is set no work starts or
# advances here: no sweep, no implementer, no reviewer, no audit, no branch update. Clearing it
# lets the next heartbeat pick the open tickets up again, but an event that fired while paused
# does not fire a second time, so the audit of a PR merged during the pause is simply skipped.
# The merge gate is deliberately outside the pause: it is a required check, so pausing it would
# strand every open pull request behind a check that never reports. An empty value reads as
# unset, GitHub's own rule for a variable that is not there, so clear the variable rather than
# blanking it.
#
# test/factory-caller-wakeups.test.mjs pins the wake-up rules below by evaluating them;
# test/factory-caller-inputs.test.mjs pins the inputs each job passes.
name: factory

on:
  issues:
    # unlabeled and unassigned: a ticket held back by ready-for-human or by an
    # assignee reaches the factory the moment the human removes the blocker,
    # instead of waiting up to ten minutes for the next heartbeat. Which of
    # those removals actually wakes a sweep is decided in the dispatch job's
    # `if:`, since `on:` cannot filter on a label name or on the ticket's state.
    types: [closed, labeled, unassigned, unlabeled]
  pull_request_target:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, closed] # closed: the first-20 audit on merged factory PRs
  push:
    branches: [main] # update-branch: bring stale auto-merge PRs up to date when main moves
  repository_dispatch:
    # factory-update-branch: sent by the review workflow on a passing verdict.
    # factory-sweep: the heartbeat, and what actually drives the sweep. Required, not optional.
    # Send it every 10 minutes from outside GitHub, with a token that has contents write on the
    # target and nothing else. One sender covers any number of targets:
    #   gh api repos/chizhangucb/chronicle/dispatches -f event_type=factory-sweep
    types: [factory-update-branch, factory-sweep]
  schedule:
    # The fallback, not the heartbeat: measured on one private target over 21 and a half hours this
    # fired 6 times against about 129 expected, so run the heartbeat above and treat it as belt and
    # braces. Off the :00 slots, since GitHub delays crons on busy minutes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write # factory/verdict, factory/red-green, factory/test-integrity
  checks: read # retry handler: the head's check runs
  actions: read # retry handler: failing runs' logs and artifacts

jobs:
  dispatch:
    # Three rules decide whether a ticket event wakes a sweep, and a sweep re-scans every ticket
    # rather than the one that was touched:
    #
    #   The ticket must be open. A label edit or an assignee removal on a closed ticket is
    #   bookkeeping on finished work, not a request to start any.
    #
    #   The removed label must not be the factory's own state (`agent:*`, `factory:*`). A run's
    #   cleanup takes its own state label off at the end; when that removal woke a sweep, the
    #   sweep could re-stamp the ticket the run had just finished with.
    #
    #   `closed` wakes a sweep whatever the label rules say: that is how a finished run is
    #   reconciled, and it arrives with the ticket already closed.
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'factory-sweep') ||
        (github.event_name == 'issues' && github.event.action == 'closed') ||
        (github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'unassigned' ||
            (github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent') ||
            (github.event.action == 'unlabeled' &&
              !startsWith(github.event.label.name, 'agent:') &&
              !startsWith(github.event.label.name, 'factory:')))))
    uses: chizhangucb/software-factory/.github/workflows/dispatch.yml@main
    secrets: inherit
    with:
      factory_ref: main
      # chronicle is public: anyone can open an issue, and a ticket body is what the
      # implementer executes. Only the owner's own tickets run (software-factory's
      # ADR 0002, 2026-09-07 amendment).
      trusted_author_associations: OWNER
  implement:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.issue.state == 'open' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  review:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      github.event_name == 'pull_request_target' && github.event.label.name == 'agent:review'
    uses: chizhangucb/software-factory/.github/workflows/agent-review.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  implement-pr:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      github.event_name == 'pull_request_target' && github.event.label.name == 'agent:implement'
    uses: chizhangucb/software-factory/.github/workflows/agent-implement-pr.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  merge-gate:
    # Outside the pause on purpose: this is the required check on a pull request, so a paused
    # factory still judges what is open rather than stranding it.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: chizhangucb/software-factory/.github/workflows/merge-gate.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
      # We have two kinds of test, and the gate runs each changed test file with
      # one command. Handed the default `node --test`, a browser spec dies on
      # import before a single test reports (#320, #335), so the command routes:
      # scripts/ci/factory-test-command.sh sends a spec to the browser suite and
      # everything else to `node --test`.
      test_command: ./scripts/ci/factory-test-command.sh
      # This REPLACES the gate's default `npm ci` rather than running after it,
      # so `npm ci &&` is load-bearing: without it both checkouts have no
      # node_modules. Run once per checkout, which is why the browser install
      # belongs here and not in test_command, which runs once per file.
      install_command: npm ci && npx playwright install --with-deps chromium
  audit:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged
    uses: chizhangucb/software-factory/.github/workflows/agent-audit.yml@main
    secrets: inherit
    with:
      factory_ref: main
      node_version: "24"
  update-branch:
    if: >-
      vars.FACTORY_PAUSED == '' &&
      (github.event_name == 'push' ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'factory-update-branch'))
    uses: chizhangucb/software-factory/.github/workflows/update-branch.yml@main
    secrets: inherit
    with:
      factory_ref: main
